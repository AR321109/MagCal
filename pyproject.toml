[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magcal-had"
version = "0.1.0"
description = "Bounded local metric-space Magnitude calibration for hyperspectral anomaly scores"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "matplotlib>=3.5,<4",
  "numpy>=1.24,<3",
  "scikit-learn>=1.2,<2",
  "scipy>=1.10,<2",
  "torch>=1.13,<3",
  "tqdm>=4.65,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["magcal*"]
